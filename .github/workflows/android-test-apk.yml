name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: "22"
  # Expo SDK 57 installs expo/fetch globally by default. Its Android response
  # handling can intermittently truncate JSON in release builds, so keep the
  # stable React Native networking implementation until the SDK fix lands.
  EXPO_PUBLIC_USE_RN_FETCH: "1"
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://staging-bni.igentechnology.net' }}
  ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON || vars.ANDROID_GOOGLE_SERVICES_JSON || secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 || vars.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  build:
    name: Build optimized standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Restore Firebase configuration
        shell: bash
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Missing Firebase variable::Add ANDROID_GOOGLE_SERVICES_JSON (raw JSON) under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! node -e "const fs=require('fs'); const value=process.env.ANDROID_GOOGLE_SERVICES_JSON.trim(); let config; let format='raw JSON'; try { config=JSON.parse(value); } catch { format='Base64'; try { config=JSON.parse(Buffer.from(value, 'base64').toString('utf8')); } catch { process.exit(1); } } fs.writeFileSync('google-services.json', JSON.stringify(config)); console.log('Firebase configuration restored from ' + format + '.');"; then
            echo "::error title=Invalid Firebase variable::Firebase configuration is neither valid raw JSON nor Base64-encoded JSON."
            exit 1
          fi

          if ! node -e "const c=require('./google-services.json'); const ok=c.client?.some(x=>x.client_info?.android_client_info?.package_name==='com.igen.connect'); if(!ok) process.exit(1)"; then
            echo "::error title=Wrong Firebase app::google-services.json does not contain Android package com.igen.connect."
            exit 1
          fi

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone APK
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error title=Missing APK::Gradle did not create $APK_PATH."
            exit 1
          fi

          if ! unzip -Z1 "$APK_PATH" | grep -Fx "assets/index.android.bundle" > /dev/null; then
            echo "::error title=Missing JavaScript bundle::The APK is not standalone and would require Metro."
            exit 1
          fi

          APK_SIZE_BYTES=$(stat --format=%s "$APK_PATH")
          APK_SIZE_MB=$(awk "BEGIN { printf \"%.1f\", $APK_SIZE_BYTES / 1024 / 1024 }")
          echo "### Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: release" >> "$GITHUB_STEP_SUMMARY"
          echo "- ABI: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${APK_SIZE_MB} MiB" >> "$GITHUB_STEP_SUMMARY"
          echo "- JavaScript bundle: embedded" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: igen-connect-standalone-arm64-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
