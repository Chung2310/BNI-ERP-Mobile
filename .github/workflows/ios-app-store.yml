name: iOS App Store build and upload

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: github.ref == 'refs/heads/production'
    runs-on: macos-26
    env:
      ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ vars.ASC_API_KEY_ISSUER_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUILD_NUMBER_BASE: ${{ vars.IOS_BUILD_NUMBER_BASE }}
      IOS_BUILD_PROFILE: production
      IOS_BUILD_PLATFORM: ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Check release settings
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL IOS_TEAM_ID IOS_BUILD_NUMBER_BASE ASC_API_KEY_ID ASC_API_KEY_ISSUER_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_APP_STORE_PROFILE_BASE64 ASC_API_KEY_P8; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error title=Missing GitHub setting::$name is required in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          if [[ ! "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Invalid Apple Team ID::IOS_TEAM_ID must be the 10-character Apple Developer Team ID."
            exit 1
          fi
          if [[ ! "$IOS_BUILD_NUMBER_BASE" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid build number base::IOS_BUILD_NUMBER_BASE must be the latest iOS build number uploaded to App Store Connect."
            exit 1
          fi
          if [[ ! "$EXPO_PUBLIC_API_URL" =~ ^https:// ]]; then
            echo "::error title=Invalid production API URL::EXPO_PUBLIC_API_URL must start with https://."
            exit 1
          fi
          build_number=$((10#$IOS_BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Check Xcode and iOS SDK
        shell: bash
        run: |
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="$(awk -F. '{ print $1 }' <<< "$xcode_version")"
          sdk_major="$(awk -F. '{ print $1 }' <<< "$sdk_version")"
          echo "Using Xcode $xcode_version with iOS SDK $sdk_version."
          if (( xcode_major < 26 || sdk_major < 26 )); then
            echo "::error title=Outdated Apple build tools::This app must be built with Xcode 26 or later and iOS SDK 26 or later."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Restore Apple signing credentials
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_app_store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios_app_store.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          for (const [name, filename] of [
            ["IOS_DISTRIBUTION_CERTIFICATE_BASE64", "ios_distribution.p12"],
            ["IOS_APP_STORE_PROFILE_BASE64", "ios_app_store.mobileprovision"],
          ]) {
            const value = process.env[name]?.replace(/\s+/g, "");
            if (!value) throw new Error(name + " is required.");
            const data = Buffer.from(value, "base64");
            if (!data.length) throw new Error(name + " is not valid Base64.");
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, filename), data, { mode: 0o600 });
          }
          NODE

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          identity_output="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -q "Apple Distribution:" <<< "$identity_output"; then
            echo "::error title=Invalid signing certificate::The P12 must contain an Apple Distribution certificate and its private key."
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          profile_push_environment="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST" 2>/dev/null || true)"
          profile_get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)"

          if [[ "$profile_team_id" != "$IOS_TEAM_ID" || "$profile_app_id" != *.com.igen.bni || "$profile_get_task_allow" != "false" ]]; then
            echo "::error title=Wrong provisioning profile::Use an App Store profile for com.igen.bni from the configured Apple Developer team."
            exit 1
          fi
          if [[ "$profile_push_environment" != "production" ]]; then
            echo "::error title=Push entitlement missing::The profile must include the production aps-environment entitlement."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Find Xcode workspace and scheme
        id: project
        shell: bash
        run: |
          workspace_path="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace_path" ]]; then
            echo "::error title=Missing Xcode workspace::Expo prebuild did not create an iOS workspace."
            exit 1
          fi
          xcodebuild -list -json -workspace "$workspace_path" > "$RUNNER_TEMP/ios-workspace.json"
          scheme="$(node -e '
            const project = require(process.argv[1]);
            const schemes = project.workspace?.schemes ?? project.project?.schemes ?? [];
            const scheme = schemes.find((name) => !/pods/i.test(name)) ?? schemes[0];
            if (!scheme) process.exit(1);
            process.stdout.write(scheme);
          ' "$RUNNER_TEMP/ios-workspace.json")"
          if [[ -z "$scheme" ]]; then
            echo "::error title=Missing Xcode scheme::No app scheme was found in the generated workspace."
            exit 1
          fi
          echo "workspace=$workspace_path" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app
        shell: bash
        env:
          IOS_WORKSPACE: ${{ steps.project.outputs.workspace }}
          IOS_SCHEME: ${{ steps.project.outputs.scheme }}
        run: |
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iGenConnect.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

      - name: Export signed IPA
        shell: bash
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/ios-export"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.igen.bni</key>
              <string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iGenConnect.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_PATH"

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error title=Missing IPA::Xcode did not create an App Store IPA."
            exit 1
          fi
          INSPECT_PATH="$RUNNER_TEMP/ipa-inspect"
          mkdir -p "$INSPECT_PATH"
          unzip -q "$IPA_PATH" -d "$INSPECT_PATH"
          APP_PATH="$(find "$INSPECT_PATH/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          if [[ "$bundle_id" != "com.igen.bni" || "$build_number" != "$IOS_BUILD_NUMBER" ]]; then
            echo "::error title=Unexpected IPA metadata::Expected com.igen.bni build $IOS_BUILD_NUMBER; got $bundle_id build $build_number."
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"
          echo "IOS_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          {
            echo "## iOS TestFlight build"
            echo "- App version: $app_version"
            echo "- Build number: $build_number"
            echo "- Bundle ID: $bundle_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: igen-connect-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          key_path="$key_directory/AuthKey_$ASC_API_KEY_ID.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          xcrun altool --validate-app --type ios --file "$IOS_IPA_PATH" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_KEY_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IOS_IPA_PATH" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_KEY_ISSUER_ID"
          echo "IPA uploaded to App Store Connect. Apple must finish processing it before it appears in TestFlight."

      - name: Clean signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "$IOS_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          if [[ -n "$IOS_PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/ios_distribution.p12" "$RUNNER_TEMP/ios_app_store.mobileprovision" "$RUNNER_TEMP/ios_app_store.plist"
          if [[ -n "$ASC_API_KEY_ID" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8"
          fi
