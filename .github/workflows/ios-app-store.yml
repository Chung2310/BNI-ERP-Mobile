name: iOS App Store build and upload

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: ios-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ vars.ASC_API_KEY_ISSUER_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Check release settings
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=0
          for name in EXPO_TOKEN ASC_API_KEY_P8 EAS_PROJECT_ID ASC_APP_ID ASC_API_KEY_ID ASC_API_KEY_ISSUER_ID EXPO_PUBLIC_API_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing GitHub setting::$name is required in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$ASC_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid App Store Connect app ID::ASC_APP_ID must contain only digits."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::error title=Invalid production API URL::EXPO_PUBLIC_API_URL must start with https://."; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Prepare App Store Connect key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Link EAS project and configure production build and submit profiles
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const appConfig = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appConfig.expo.extra ??= {};
          appConfig.expo.extra.eas ??= {};
          const configuredProjectId = appConfig.expo.extra.eas.projectId;
          if (configuredProjectId && configuredProjectId !== process.env.EAS_PROJECT_ID) {
            throw new Error('EAS_PROJECT_ID does not match expo.extra.eas.projectId in app.json.');
          }
          appConfig.expo.extra.eas.projectId = process.env.EAS_PROJECT_ID;
          fs.writeFileSync('app.json', `${JSON.stringify(appConfig, null, 2)}\n`);

          const easConfig = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          easConfig.build.production.env ??= {};
          easConfig.build.production.env.EXPO_PUBLIC_API_URL = process.env.EXPO_PUBLIC_API_URL;
          easConfig.build.production.env.EXPO_PUBLIC_EAS_PROJECT_ID = process.env.EAS_PROJECT_ID;
          easConfig.submit ??= {};
          easConfig.submit.production ??= {};
          easConfig.submit.production.ios = {
            ...easConfig.submit.production.ios,
            ascAppId: process.env.ASC_APP_ID,
            ascApiKeyPath: process.env.ASC_API_KEY_PATH,
            ascApiKeyId: process.env.ASC_API_KEY_ID,
            ascApiKeyIssuerId: process.env.ASC_API_KEY_ISSUER_ID,
          };
          fs.writeFileSync('eas.json', `${JSON.stringify(easConfig, null, 2)}\n`);
          NODE

      - name: Build iOS app with EAS
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build to App Store Connect
        run: npx eas-cli@latest submit --platform ios --latest --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Remove temporary App Store Connect key
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_API_KEY_PATH:-}" ]]; then
            rm -f "$ASC_API_KEY_PATH"
          fi
